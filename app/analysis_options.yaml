# 静态分析配置:默认 flutter_lints + 严格模式(T3 强化,2026-09-14)。
# 原则:发现问题改代码,而不是关规则;确属误报用 // ignore: <rule> 并注释原因。
# 裁剪记录(下批再开,见 docs/qa-plan-20260914.md):strict-raw-types(25 条测试
# Map 裸类型需逐个显式化)、strict-inference(25 条测试字面量)、unnecessary_lambdas(15)、
# avoid_redundant_argument_values(50,UI 显式传参默认值属故意)。

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true

linter:
  rules:
    unawaited_futures: true
    always_declare_return_types: true
